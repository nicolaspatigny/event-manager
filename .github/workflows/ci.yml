name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB and wait for readiness
        run: bash scripts/ci-mongo.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew test bootJar --no-daemon
        working-directory: backend
      - name: Collect MongoDB startup logs
        if: always()
        run: |
          mkdir -p artifacts
          docker logs event-manager-ci-mongo > artifacts/mongo-ci.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests
            artifacts/mongo-ci.log
      - name: Stop CI MongoDB
        if: always()
        run: docker rm -f event-manager-ci-mongo || true
  frontend-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB and wait for readiness
        run: bash scripts/ci-mongo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/e2e.sh
      - name: Collect MongoDB startup logs
        if: always()
        run: |
          mkdir -p artifacts
          docker logs event-manager-ci-mongo > artifacts/mongo-ci.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            artifacts/screenshots
            artifacts/mongo-ci.log
      - name: Stop CI MongoDB
        if: always()
        run: docker rm -f event-manager-ci-mongo || true
